  <text x="44" y="77" font-family="'Segoe UI', -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#F1F5F9">Selected Reference Corpus</text>
  <text x="44" y="102" font-family="'Fira Code', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="14" fill="#C4B5FD">fix(settings): stabilize subpage switching and recap interaction</text>

